# Vitodens 222-W WS2B + Vitotronic 200 H01B 
substitutions:
  name: viessmann-vitodens-optolink
  friendly_name: Viessmann Vitodens

  vitoconnect_update_interval: 60s

  # Range exposed to Home Assistant for the optimizer heating-setpoint layer.
  # Direct boiler setpoint entities retain the wider device-safe range below.
  optimizer_heating_setpoint_min: "19"
  optimizer_heating_setpoint_max: "25"
  heating_setpoint_direct_min: "3"
  heating_setpoint_direct_max: "30"
  heating_setpoint_default_baseline: "22"

  # Watchdog: revert to baseline if no heartbeat for this long (milliseconds).
  optimizer_heartbeat_timeout_ms: "1800000"   # 30 minutes

  # Internal rate limit for writes to the boiler (milliseconds).
  optimizer_min_write_interval_ms: "120000"  # 2 minutes
  optimizer_restore_debounce_ms: "5000"
  # Wire truth expires independently of the HA API connection.
  optimizer_readback_max_age_ms: "180000"
  optimizer_readback_pair_max_skew_ms: "15000"
  optimizer_restore_retry_ms: "120000"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.0
  build_path: esp32
  platformio_options:
    upload_speed: 115200

  # Safe initialization: always start with offset=0 after reboot.
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Restore any known baseline on boot, even if a recent armed flag
          // had not reached persistent storage before power was lost.
          const bool resume_restore = id(setpoint_baseline_valid) || id(restore_required) ||
                                      id(setpoint_control_armed) || id(watchdog_tripped);
          id(setpoint_control_armed) = false;
          id(heating_setpoint_control_armed).publish_state(false);
          id(desired_offset) = 0;
          id(last_heartbeat_ms) = 0;
          id(armed_at_ms) = 0;
          id(restore_recovery_requested) = false;
          id(restore_recovery_requested_at_ms) = 0;
          id(last_apply_ms) = 0;
          id(last_setpoint_apply_ms) = 0;
          id(last_restore_attempt_ms) = 0;
          id(desired_heating_setpoint_target) = ${heating_setpoint_default_baseline};
          id(boot_baseline_enforced) = false;
          id(boot_setpoint_baseline_enforced) = false;
          const float normal = id(baseline_heating_setpoint_normal);
          const float reduced = id(baseline_heating_setpoint_reduced);
          const bool baseline_ok =
            !isnan(normal) && !isnan(reduced) &&
            normal >= ${optimizer_heating_setpoint_min} && normal <= ${optimizer_heating_setpoint_max} &&
            reduced >= ${optimizer_heating_setpoint_min} && reduced <= ${optimizer_heating_setpoint_max};
          if (id(setpoint_baseline_valid) && !baseline_ok) {
            ESP_LOGW("optimizer", "Discarding invalid persisted heating setpoint baseline %.0f/%.0f; refusing setpoint writes until a valid readback is captured.",
                     normal, reduced);
            id(setpoint_baseline_valid) = false;
            // Retain the old values for diagnosis; they are not writable authority.
          }
          id(commissioning_required) = !id(setpoint_baseline_valid);
          if (resume_restore || id(commissioning_required)) {
            id(restore_heating_setpoints_to_baseline).execute();
          }

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

# Use the write-enabled vitoconnect fork shipped in this artifact ZIP.
# Folder layout (relative to this YAML):
#   ./components/vitoconnect/...
external_components:
  - source:
      type: local
      path: ./components
    components: [vitoconnect]

logger:
  hardware_uart: UART0
  level: DEBUG   # if you ever see UART timeouts again, try INFO

uart:
  - id: uart_vitoconnect
    rx_pin: GPIO05
    tx_pin: GPIO02
    baud_rate: 4800
    data_bits: 8
    parity: EVEN
    stop_bits: 2

vitoconnect:
  id: vito
  uart_id: uart_vitoconnect
  protocol: P300
  update_interval: ${vitoconnect_update_interval}

  # Supported by the included fork.
  verify_writes: true
  max_write_failures: 3

# -----------------------------------------------------------------------------
# Globals used by the fail-safe optimizer layer
# -----------------------------------------------------------------------------
globals:
  # No trusted fallback exists in this state. Only explicit operator capture
  # may commission it; ordinary restore requests never trust current outputs.
  - id: commissioning_required
    type: bool
    restore_value: yes
    initial_value: "true"
  # An outstanding safety obligation survives disarm, transport retry exhaustion,
  # HA loss and reboot. Only fresh, matching readbacks may clear it.
  - id: restore_required
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: restore_normal_sequence
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: restore_reduced_sequence
    type: uint32_t
    restore_value: no
    initial_value: "0"
  # Stored safe baselines for HK1 heating setpoints (persisted across reboots).
  # These are restored on watchdog trip, HA/API loss, optimizer disable, and safe boot.
  - id: baseline_heating_setpoint_normal
    type: float
    restore_value: yes
    initial_value: "${heating_setpoint_default_baseline}"

  - id: baseline_heating_setpoint_reduced
    type: float
    restore_value: yes
    initial_value: "${heating_setpoint_default_baseline}"

  - id: setpoint_baseline_valid
    type: bool
    restore_value: yes
    initial_value: "false"

  # Whether HA has explicitly armed heating-setpoint control mode.
  # This is persisted so an ESP reboot during setpoint-control mode can safely
  # restore setpoint baselines on boot.
  - id: setpoint_control_armed
    type: bool
    restore_value: yes
    initial_value: "false"

  # Current requested optimizer offset (volatile; always starts at 0 after reboot).
  - id: desired_offset
    type: float
    restore_value: no
    initial_value: "0"

  # Current requested optimizer heating setpoint target (volatile; safe boot restores baseline).
  - id: desired_heating_setpoint_target
    type: float
    restore_value: no
    initial_value: "${heating_setpoint_default_baseline}"

  # Watchdog timestamps / state (volatile).
  - id: last_heartbeat_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: armed_at_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: last_apply_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: last_setpoint_apply_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: last_restore_attempt_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: watchdog_tripped
    type: bool
    restore_value: yes
    initial_value: "false"

  - id: restore_recovery_requested
    type: bool
    restore_value: no
    initial_value: "false"

  - id: restore_recovery_requested_at_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: boot_baseline_enforced
    type: bool
    restore_value: no
    initial_value: "false"

  - id: boot_setpoint_baseline_enforced
    type: bool
    restore_value: no
    initial_value: "false"

# -----------------------------------------------------------------------------
# Scripts
# -----------------------------------------------------------------------------
script:
  - id: apply_heating_setpoint
    mode: queued
    then:
      - lambda: |-
          if (!id(setpoint_baseline_valid)) {
            ESP_LOGW("optimizer", "Heating setpoint baseline not known yet; skipping setpoint apply.");
            return;
          }
          if (id(watchdog_tripped) || id(restore_required) ||
              !id(heating_setpoint_normal_direct).readIsFresh(${optimizer_readback_max_age_ms}) ||
              !id(heating_setpoint_reduced_direct).readIsFresh(${optimizer_readback_max_age_ms})) {
            ESP_LOGW("optimizer", "No current control permission or wire truth; skipping setpoint apply.");
            return;
          }
          if (!id(setpoint_control_armed)) {
            ESP_LOGD("optimizer", "Heating setpoint control is not armed; skipping setpoint apply.");
            return;
          }

          const uint32_t now = millis();
          const uint32_t min_interval = (uint32_t) ${optimizer_min_write_interval_ms};

          float target = id(desired_heating_setpoint_target);
          if (target < ${optimizer_heating_setpoint_min}) target = ${optimizer_heating_setpoint_min};
          if (target > ${optimizer_heating_setpoint_max}) target = ${optimizer_heating_setpoint_max};
          if (target < ${heating_setpoint_direct_min}) target = ${heating_setpoint_direct_min};
          if (target > ${heating_setpoint_direct_max}) target = ${heating_setpoint_direct_max};

          if (fabsf(id(desired_heating_setpoint_target) - target) > 0.01f) {
            id(desired_heating_setpoint_target) = target;
            id(heating_setpoint_target_optimizer).publish_state(target);
          }

          const float cur_normal = id(heating_setpoint_normal_direct).state;
          const float cur_reduced = id(heating_setpoint_reduced_direct).state;
          const bool normal_ok = !isnan(cur_normal) && fabsf(cur_normal - target) < 0.01f;
          const bool reduced_ok = !isnan(cur_reduced) && fabsf(cur_reduced - target) < 0.01f;
          const bool normal_pending = id(heating_setpoint_normal_direct).hasPendingCommand();
          const bool reduced_pending = id(heating_setpoint_reduced_direct).hasPendingCommand();
          const bool active_write_pending =
            id(heating_setpoint_normal_direct).hasActiveWriteCommand() ||
            id(heating_setpoint_reduced_direct).hasActiveWriteCommand();
          const bool normal_pending_matches = normal_pending &&
            fabsf(id(heating_setpoint_normal_direct).getPendingCommandValue() - target) < 0.01f;
          const bool reduced_pending_matches = reduced_pending &&
            fabsf(id(heating_setpoint_reduced_direct).getPendingCommandValue() - target) < 0.01f;
          const bool pending_mismatch =
            (normal_pending && !normal_pending_matches) ||
            (reduced_pending && !reduced_pending_matches);
          if (normal_ok && reduced_ok && !normal_pending && !reduced_pending) {
            ESP_LOGD("optimizer", "Heating setpoints already %.0f/%.0f -> no write.", target, target);
            return;
          }

          if (id(last_setpoint_apply_ms) != 0 &&
              (uint32_t)(now - id(last_setpoint_apply_ms)) < min_interval &&
              (!pending_mismatch || active_write_pending)) {
            ESP_LOGD("optimizer", "Heating setpoint write rate-limited; pending target remains %.0f (%u ms since last write).",
                     target, (unsigned) (now - id(last_setpoint_apply_ms)));
            return;
          }

          if (pending_mismatch) {
            ESP_LOGI("optimizer", "Replacing stale pending heating setpoint command with %.0f/%.0f", target, target);
          } else {
            ESP_LOGI("optimizer", "Writing heating setpoints: normal=%.0f reduced=%.0f", target, target);
          }
          id(heating_setpoint_normal_direct).control(target);
          id(heating_setpoint_reduced_direct).control(target);
          id(last_setpoint_apply_ms) = now;

  - id: restore_heating_setpoints_to_baseline
    mode: restart
    then:
      - lambda: |-
          // Stopped control and baseline intent are established BEFORE any no-op decision.
          const uint32_t now = millis();
          id(setpoint_control_armed) = false;
          id(heating_setpoint_control_armed).publish_state(false);
          id(last_heartbeat_ms) = 0;
          id(armed_at_ms) = 0;
          id(desired_offset) = 0;
          const float normal = id(baseline_heating_setpoint_normal);
          const float reduced = id(baseline_heating_setpoint_reduced);
          if (!id(setpoint_baseline_valid) || !std::isfinite(normal) || !std::isfinite(reduced) ||
              normal < ${optimizer_heating_setpoint_min} || normal > ${optimizer_heating_setpoint_max} ||
              reduced < ${optimizer_heating_setpoint_min} || reduced > ${optimizer_heating_setpoint_max}) {
            // An unknown destination is NOT a known-baseline restore obligation.
            // Stop unsent work; an in-flight command remains visible until it ends.
            id(setpoint_baseline_valid) = false;
            id(commissioning_required) = true;
            id(restore_required) = false;
            id(heating_setpoint_normal_direct).cancelPendingCommand();
            id(heating_setpoint_reduced_direct).cancelPendingCommand();
            ESP_LOGE("optimizer", "No trusted baseline: disarmed, operator commissioning required; no fallback value written.");
            return;
          }
          id(commissioning_required) = false;
          if (!id(restore_required)) {
            id(restore_required) = true;
            id(restore_normal_sequence) = id(heating_setpoint_normal_direct).getReadSequence();
            id(restore_reduced_sequence) = id(heating_setpoint_reduced_direct).getReadSequence();
            id(last_restore_attempt_ms) = 0;
          }
          id(desired_heating_setpoint_target) = normal;
          id(heating_setpoint_target_optimizer).publish_state(normal);
          auto &n = *id(heating_setpoint_normal_direct);
          auto &r = *id(heating_setpoint_reduced_direct);
          const bool normal_ok = n.has_state() && fabsf(n.state - normal) < 0.01f;
          const bool reduced_ok = r.has_state() && fabsf(r.state - reduced) < 0.01f;
          const bool fresh = n.readIsFresh(${optimizer_readback_max_age_ms}) &&
                             r.readIsFresh(${optimizer_readback_max_age_ms});
          const bool advanced = n.getReadSequence() != id(restore_normal_sequence) &&
                                r.getReadSequence() != id(restore_reduced_sequence);
          if (fresh && advanced && normal_ok && reduced_ok && !n.hasPendingCommand() && !r.hasPendingCommand()) {
            id(restore_required) = false;
            id(watchdog_tripped) = false;
            id(restore_recovery_requested) = false;
            id(restore_recovery_requested_at_ms) = 0;
            ESP_LOGI("optimizer", "Baseline restore freshly verified: %.0f/%.0f; control remains disarmed.", normal, reduced);
            return;
          }
          // A transport budget ends one attempt, not this obligation. Never reset an
          // active matching attempt; do replace a conflicting one, including in-flight.
          const bool retry_due = id(last_restore_attempt_ms) == 0 ||
            (uint32_t)(now - id(last_restore_attempt_ms)) >= ${optimizer_restore_retry_ms};
          bool submitted = false;
          auto reconcile = [&](auto &dp, float target, bool actual_ok) {
            const bool pending = dp.hasPendingCommand();
            const bool conflict = pending && fabsf(dp.getPendingCommandValue() - target) >= 0.01f;
            const bool idle = dp.getLastUpdate() == 0 && !dp.hasActiveWriteCommand();
            if (conflict || (retry_due && idle && (pending || !actual_ok))) {
              dp.control(target);
              submitted = true;
            }
          };
          reconcile(n, normal, normal_ok);
          reconcile(r, reduced, reduced_ok);
          if (submitted) {
            id(last_restore_attempt_ms) = now == 0 ? 1 : now;
            id(last_setpoint_apply_ms) = now;
          }

  - id: revert_to_baseline
    mode: restart
    then:
      - lambda: |-
          // The restore script is idempotent only for the current active obligation.
          // In particular, a recent *completed* restore never suppresses a new one.
          id(restore_heating_setpoints_to_baseline).execute();

# -----------------------------------------------------------------------------
# Fail-safe optimizer interface for Home Assistant
# -----------------------------------------------------------------------------
switch:
  - platform: template
    name: "Boiler optimizer enabled"
    id: optimizer_enabled
    entity_category: config
    icon: mdi:tune
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    disabled_by_default: true
    internal: true
    turn_on_action:
      - if:
          condition:
            lambda: |-
              return id(setpoint_control_armed);
          then:
            - script.execute: apply_heating_setpoint
    turn_off_action:
      - script.execute: revert_to_baseline

  - platform: template
    name: "Heating setpoint control armed"
    id: heating_setpoint_control_armed
    entity_category: config
    icon: mdi:shield-check
    lambda: |-
      return id(setpoint_control_armed);
    turn_on_action:
      - lambda: |-
          // An idempotent turn_on must neither extend the lease nor abandon a
          // currently owned write. Faulted ownership instead requests restore.
          if (id(setpoint_control_armed)) {
            if (id(restore_required) || id(watchdog_tripped)) {
              id(restore_heating_setpoints_to_baseline).execute();
            }
            return;
          }
          const float normal = id(baseline_heating_setpoint_normal);
          const float reduced = id(baseline_heating_setpoint_reduced);
          auto &n = *id(heating_setpoint_normal_direct);
          auto &r = *id(heating_setpoint_reduced_direct);
          const bool safe = id(setpoint_baseline_valid) && !id(restore_required) && !id(watchdog_tripped) &&
            std::isfinite(normal) && std::isfinite(reduced) &&
            normal >= ${optimizer_heating_setpoint_min} && normal <= ${optimizer_heating_setpoint_max} &&
            reduced >= ${optimizer_heating_setpoint_min} && reduced <= ${optimizer_heating_setpoint_max} &&
            n.readIsFresh(${optimizer_readback_max_age_ms}) && r.readIsFresh(${optimizer_readback_max_age_ms}) &&
            !n.hasPendingCommand() && !r.hasPendingCommand() &&
            fabsf(n.state - normal) < 0.01f && fabsf(r.state - reduced) < 0.01f;
          if (!safe) {
            id(setpoint_control_armed) = false;
            id(heating_setpoint_control_armed).publish_state(false);
            ESP_LOGW("optimizer", "Refusing arm until baseline is freshly verified and restoration is complete.");
            if (id(setpoint_baseline_valid) || n.hasPendingCommand() || r.hasPendingCommand()) {
              id(restore_heating_setpoints_to_baseline).execute();
            }
            return;
          }
          id(desired_heating_setpoint_target) = normal;
          id(heating_setpoint_target_optimizer).publish_state(normal);
          id(setpoint_control_armed) = true;
          id(armed_at_ms) = millis();
          id(last_heartbeat_ms) = 0;
          id(heating_setpoint_control_armed).publish_state(true);
    turn_off_action:
      - script.execute: revert_to_baseline

number:
  # Bounded setpoint-control surface. The ESP writes this target to both
  # Viessmann normal and reduced heating setpoints.
  - platform: template
    name: "Heating setpoint target (optimizer)"
    id: heating_setpoint_target_optimizer
    entity_category: config
    icon: mdi:thermostat
    min_value: ${optimizer_heating_setpoint_min}
    max_value: ${optimizer_heating_setpoint_max}
    step: 1
    mode: slider
    restore_value: no
    optimistic: false
    set_action:
      - lambda: |-
          if (!id(setpoint_control_armed)) {
            const float safe_target = id(setpoint_baseline_valid)
              ? id(baseline_heating_setpoint_normal)
              : (float) ${heating_setpoint_default_baseline};
            id(desired_heating_setpoint_target) = safe_target;
            id(heating_setpoint_target_optimizer).publish_state(safe_target);
            ESP_LOGW("optimizer", "Ignoring setpoint target %.0f while setpoint control is not armed; safe target remains %.0f.", x, safe_target);
            return;
          }
          if (id(watchdog_tripped) || id(restore_required)) {
            const float safe_target = id(setpoint_baseline_valid)
              ? id(baseline_heating_setpoint_normal)
              : (float) ${heating_setpoint_default_baseline};
            id(desired_heating_setpoint_target) = safe_target;
            id(heating_setpoint_target_optimizer).publish_state(safe_target);
            ESP_LOGW("optimizer", "Ignoring setpoint target %.0f while watchdog is tripped; safe target remains %.0f.", x, safe_target);
            return;
          }
          if (!std::isfinite(x) || !id(setpoint_baseline_valid)) return;
          const float accepted = roundf(std::min(std::max(x, (float) ${optimizer_heating_setpoint_min}),
                                                (float) ${optimizer_heating_setpoint_max}));
          id(desired_heating_setpoint_target) = accepted;
          id(heating_setpoint_target_optimizer).publish_state(accepted);
      - script.execute: apply_heating_setpoint

  # --- Direct boiler writeables (disabled by default; use with care) ---------
  
  # Setpoint-control mode writes both normal and reduced. HA should write only
  # "Heating setpoint target (optimizer)" during normal operation.
  - platform: vitoconnect
    vitoconnect_id: vito
    id: heating_setpoint_normal_direct
    name: "Heating setpoint normal ⚠ direct"
    entity_category: diagnostic
    disabled_by_default: true
    internal: true
    address: 0x2306
    length: 1
    min_value: ${heating_setpoint_direct_min}
    max_value: ${heating_setpoint_direct_max}
    step: 1

  - platform: vitoconnect
    vitoconnect_id: vito
    id: heating_setpoint_reduced_direct
    name: "Heating setpoint reduced ⚠ direct"
    entity_category: diagnostic
    disabled_by_default: true
    internal: true
    address: 0x2307
    length: 1
    min_value: ${heating_setpoint_direct_min}
    max_value: ${heating_setpoint_direct_max}
    step: 1


select:
  # Commanded operating mode for Vitotronic 200 HO1B / VScotHO1, heating circuit A1/M1.
  # 0x2301 is commonly useful for read-only/display mode; 0x2323 is the
  # writable operating-mode datapoint for A1/M1.
  - platform: vitoconnect
    vitoconnect_id: vito
    id: operating_mode_a1m1
    name: "Operating mode"
    entity_category: config
    icon: mdi:home-thermometer
    address: 0x2323
    length: 1
    options:
      - value: 0
        label: "Off / frost protection"
      - value: 1
        label: "Hot water only"
      - value: 2
        label: "Hot water + heating"
      - value: 3
        label: "Continuous reduced"
      - value: 4
        label: "Continuous normal"

button:
  - platform: template
    name: "Optimizer heartbeat"
    id: optimizer_heartbeat
    entity_category: diagnostic
    icon: mdi:heart-pulse
    on_press:
      - lambda: |-
          if (!id(setpoint_control_armed)) {
            ESP_LOGW("optimizer", "Ignoring optimizer heartbeat while setpoint control is not armed.");
            return;
          }
          if (id(watchdog_tripped) || id(restore_required) ||
              !id(heating_setpoint_normal_direct).readIsFresh(${optimizer_readback_max_age_ms}) ||
              !id(heating_setpoint_reduced_direct).readIsFresh(${optimizer_readback_max_age_ms})) {
            ESP_LOGW("optimizer", "Ignoring optimizer heartbeat while watchdog is tripped; use restore-baseline recovery.");
            return;
          }
          id(last_heartbeat_ms) = millis();

  - platform: template
    name: "Revert boiler controls to baseline"
    id: revert_baseline_button
    entity_category: config
    icon: mdi:backup-restore
    on_press:
      - script.execute: revert_to_baseline

  - platform: template
    name: "Set optimizer baselines from current boiler"
    id: set_baseline_from_current
    entity_category: config
    icon: mdi:content-save
    on_press:
      - lambda: |-
          auto &n = *id(heating_setpoint_normal_direct);
          auto &r = *id(heating_setpoint_reduced_direct);
          const uint32_t now = millis();
          const uint32_t n_age = now - n.getLastReadMs();
          const uint32_t r_age = now - r.getLastReadMs();
          const uint32_t skew = n_age > r_age ? n_age - r_age : r_age - n_age;
          const bool commissioning = id(commissioning_required) && !id(setpoint_baseline_valid);
          if (id(setpoint_control_armed) || id(restore_required) || (id(watchdog_tripped) && !commissioning) ||
              n.hasPendingCommand() || r.hasPendingCommand() ||
              !n.readIsFresh(${optimizer_readback_max_age_ms}) || !r.readIsFresh(${optimizer_readback_max_age_ms}) ||
              skew > ${optimizer_readback_pair_max_skew_ms} ||
              !std::isfinite(n.state) || !std::isfinite(r.state) ||
              n.state < ${optimizer_heating_setpoint_min} || n.state > ${optimizer_heating_setpoint_max} ||
              r.state < ${optimizer_heating_setpoint_min} || r.state > ${optimizer_heating_setpoint_max}) {
            ESP_LOGW("optimizer", "Baseline capture refused: require idle, disarmed control and a fresh coherent pair.");
            return;
          }
          id(baseline_heating_setpoint_normal) = n.state;
          id(baseline_heating_setpoint_reduced) = r.state;
          id(setpoint_baseline_valid) = true;
          id(commissioning_required) = false;
          // The operator has deliberately established a new trusted fallback.
          // This does not arm control or acknowledge any former optimized write.
          id(watchdog_tripped) = false;
          id(restore_recovery_requested) = false;
          id(desired_heating_setpoint_target) = n.state;
          id(heating_setpoint_target_optimizer).publish_state(n.state);
          ESP_LOGI("optimizer", "Captured trusted baseline %.0f/%.0f.", n.state, r.state);

# -----------------------------------------------------------------------------
# Sensors (original + optimizer diagnostics)
# -----------------------------------------------------------------------------
sensor:
  # 2‑byte device identification value (kept internal; exposed as hex text below)
  - platform: vitoconnect
    vitoconnect_id: vito
    entity_category: diagnostic
    id: device_id_raw
    name: "Device ID (raw)"
    address: 0x00F8
    length: 2
    internal: true

  # Temperatures (/10)
  - platform: vitoconnect
    vitoconnect_id: vito
    name: "Outdoor temperature"
    address: 0x5525
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters: [ { multiply: 0.1 } ]

  - platform: vitoconnect
    vitoconnect_id: vito
    name: "Boiler temperature"
    address: 0x0802
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters: [ { multiply: 0.1 } ]

  - platform: vitoconnect
    vitoconnect_id: vito
    name: "Boiler setpoint"
    address: 0x555A
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters: [ { multiply: 0.1 } ]

  - platform: vitoconnect
    vitoconnect_id: vito
    name: "DHW setpoint"
    address: 0x6300
    length: 1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: vitoconnect
    vitoconnect_id: vito
    name: "DHW tank temperature"
    address: 0x0804
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters: [ { multiply: 0.1 } ]

  - platform: vitoconnect
    vitoconnect_id: vito
    name: "DHW outlet temperature"
    address: 0x0814
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters: [ { multiply: 0.1 } ]

  # Read-only UI sensors backed by the direct writeable numbers above.
  # This avoids registering duplicate vitoconnect datapoints for the same Optolink addresses.
  - platform: template
    name: "Heating setpoint (normal)"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      if (!id(heating_setpoint_normal_direct).readIsFresh(${optimizer_readback_max_age_ms})) return NAN;
      const float v = id(heating_setpoint_normal_direct).state;
      if (isnan(v)) return NAN;
      return v;

  - platform: template
    name: "Heating setpoint (reduced)"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      if (!id(heating_setpoint_reduced_direct).readIsFresh(${optimizer_readback_max_age_ms})) return NAN;
      const float v = id(heating_setpoint_reduced_direct).state;
      if (isnan(v)) return NAN;
      return v;

  - platform: vitoconnect
    vitoconnect_id: vito
    name: "Heating flow setpoint"
    address: 0x2544
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters: [ { multiply: 0.1 } ]

  - platform: vitoconnect
    vitoconnect_id: vito
    name: "Heating flow temperature"
    address: 0x2900
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters: [ { multiply: 0.1 } ]

  - platform: vitoconnect
    vitoconnect_id: vito
    name: "Flue gas temperature"
    address: 0x0808
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters: [ { multiply: 0.1 } ]

  # NOTE:
  # The address 0xA38F is listed in vito.xml as len=2 for some devices. Your existing setup
  # uses len=1 with *0.5 scaling and reports realistic values (see entities.csv), so we keep it unchanged.
  - platform: vitoconnect
    vitoconnect_id: vito
    name: "Burner power"
    address: 0xA38F
    length: 1
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters: [ { multiply: 0.5 } ]

  - platform: vitoconnect
    vitoconnect_id: vito
    entity_category: diagnostic
    name: "Burner starts"
    address: 0x088A
    length: 4
    icon: mdi:counter
    state_class: total_increasing
    accuracy_decimals: 0

  - platform: vitoconnect
    vitoconnect_id: vito
    entity_category: diagnostic
    name: "Burner runtime"
    address: 0x08A7
    length: 4
    unit_of_measurement: "h"
    icon: mdi:timer-outline
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - lambda: return x / 3600.0;

  # --- Optimizer diagnostics -------------------------------------------------
  - platform: template
    name: "Heating setpoint baseline normal"
    id: heating_setpoint_baseline_normal_sensor
    entity_category: diagnostic
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      if (!id(setpoint_baseline_valid)) return NAN;
      return id(baseline_heating_setpoint_normal);

  - platform: template
    name: "Heating setpoint baseline reduced"
    id: heating_setpoint_baseline_reduced_sensor
    entity_category: diagnostic
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      if (!id(setpoint_baseline_valid)) return NAN;
      return id(baseline_heating_setpoint_reduced);

  - platform: template
    name: "Heating setpoint effective target"
    id: heating_setpoint_effective_target
    entity_category: diagnostic
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      float t = id(desired_heating_setpoint_target);
      if (t < ${optimizer_heating_setpoint_min}) t = ${optimizer_heating_setpoint_min};
      if (t > ${optimizer_heating_setpoint_max}) t = ${optimizer_heating_setpoint_max};
      if (t < ${heating_setpoint_direct_min}) t = ${heating_setpoint_direct_min};
      if (t > ${heating_setpoint_direct_max}) t = ${heating_setpoint_direct_max};
      return t;

  - platform: template
    name: "Optimizer heartbeat age"
    id: optimizer_heartbeat_age
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (id(last_heartbeat_ms) == 0) return NAN;
      return (uint32_t)(millis() - id(last_heartbeat_ms)) / 1000.0f;

binary_sensor:
  - platform: template
    name: "Optimizer commissioning required"
    entity_category: diagnostic
    device_class: problem
    lambda: "return id(commissioning_required) || !id(setpoint_baseline_valid);"

  - platform: template
    name: "Optimizer boiler link healthy"
    entity_category: diagnostic
    lambda: |-
      return id(heating_setpoint_normal_direct).readIsFresh(${optimizer_readback_max_age_ms}) &&
             id(heating_setpoint_reduced_direct).readIsFresh(${optimizer_readback_max_age_ms});
  - platform: template
    name: "Optimizer baseline restore required"
    entity_category: diagnostic
    lambda: "return id(restore_required);"

  - platform: vitoconnect
    vitoconnect_id: vito
    name: "Heating circuit pump active"
    address: 0x2906
    device_class: running

  - platform: vitoconnect
    vitoconnect_id: vito
    name: "Burner active"
    address: 0x55D3
    device_class: running

  - platform: vitoconnect
    vitoconnect_id: vito
    entity_category: diagnostic
    name: "Burner fault"
    address: 0x0883
    device_class: problem

  - platform: vitoconnect
    vitoconnect_id: vito
    entity_category: diagnostic
    name: "General fault"
    address: 0x0A82
    device_class: problem

  - platform: template
    name: "Setpoint baseline valid"
    id: setpoint_baseline_valid_sensor
    entity_category: diagnostic
    lambda: |-
      return id(setpoint_baseline_valid);

  - platform: template
    name: "Optimizer watchdog tripped"
    id: optimizer_watchdog_tripped
    entity_category: diagnostic
    device_class: problem
    lambda: |-
      return id(watchdog_tripped);

text_sensor:
  # Contract v1 consumed by HA's actuator_status_entity selector (under 255 bytes).
  - platform: template
    id: optimizer_actuator_status
    name: "Optimizer actuator status"
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      auto &n = *id(heating_setpoint_normal_direct);
      auto &r = *id(heating_setpoint_reduced_direct);
      const uint32_t now = millis();
      const uint32_t na = n.getReadSequence() ? now - n.getLastReadMs() : UINT32_MAX;
      const uint32_t ra = r.getReadSequence() ? now - r.getLastReadMs() : UINT32_MAX;
      const bool healthy = n.readIsFresh(${optimizer_readback_max_age_ms}) && r.readIsFresh(${optimizer_readback_max_age_ms});
      const bool pending = n.hasPendingCommand() || r.hasPendingCommand() ||
        (id(setpoint_control_armed) && (fabsf(n.state - id(desired_heating_setpoint_target)) >= 0.01f ||
                                      fabsf(r.state - id(desired_heating_setpoint_target)) >= 0.01f));
      char status[256];
      snprintf(status, sizeof(status),
        "{\"v\":1,\"n\":%.2f,\"r\":%.2f,\"na\":%u,\"ra\":%u,\"ns\":%u,\"rs\":%u,\"p\":%s,\"restore\":%s,\"healthy\":%s}",
        std::isfinite(n.state) ? n.state : 0.0f, std::isfinite(r.state) ? r.state : 0.0f,
        (unsigned) na, (unsigned) ra, (unsigned) n.getReadSequence(), (unsigned) r.getReadSequence(),
        pending ? "true" : "false", id(restore_required) ? "true" : "false", healthy ? "true" : "false");
      return std::string(status);

  - platform: template
    name: "Device ID"
    entity_category: diagnostic
    update_interval: ${vitoconnect_update_interval}
    lambda: |-
      if (!id(device_id_raw).has_state()) return {};
      int32_t s = (int32_t) id(device_id_raw).state;
      uint16_t u = (uint16_t) s;
      uint16_t swapped = (uint16_t)((u << 8) | (u >> 8));
      char buf[32];
      snprintf(buf, sizeof(buf), "0x%04X (openv 0x%04X)", u, swapped);
      return std::string(buf);

# -----------------------------------------------------------------------------
# Watchdog + baseline capture / boot enforcement
# -----------------------------------------------------------------------------
interval:
  # Baseline capture is deliberately operator-only. Healthy reads or HA startup
  # cannot silently adopt possibly optimized values as a trusted fallback.

  # Boiler-read freshness is independent of HA heartbeat freshness.
  - interval: 5s
    then:
      - lambda: |-
          id(heating_setpoint_normal_direct).expireRead(${optimizer_readback_max_age_ms});
          id(heating_setpoint_reduced_direct).expireRead(${optimizer_readback_max_age_ms});
          if (!id(setpoint_control_armed)) return;
          const uint32_t now = millis();
          const uint32_t deadline_base = id(last_heartbeat_ms) != 0 ? id(last_heartbeat_ms) : id(armed_at_ms);
          const bool stale_heartbeat = (uint32_t)(now - deadline_base) > ${optimizer_heartbeat_timeout_ms};
          const bool stale_reads = !id(heating_setpoint_normal_direct).readIsFresh(${optimizer_readback_max_age_ms}) ||
                                   !id(heating_setpoint_reduced_direct).readIsFresh(${optimizer_readback_max_age_ms});
          if (stale_heartbeat || stale_reads) {
            id(watchdog_tripped) = true;
            id(restore_heating_setpoints_to_baseline).execute();
          }

  # Retry through outages, while disarmed and with HA absent. Matching active
  # attempts are not restarted; idle exhausted attempts get a new bounded budget.
  - interval: 5s
    then:
      - if:
          condition:
            lambda: "return id(restore_required);"
          then:
            - script.execute: restore_heating_setpoints_to_baseline

  - interval: 30s
    then:
      - if:
          condition:
            lambda: |-
              return id(setpoint_control_armed) && id(setpoint_baseline_valid) &&
                     !id(watchdog_tripped) && !id(restore_required);
          then:
            - script.execute: apply_heating_setpoint

# Prefer the ETH01-EVO wired connection and keep Wi-Fi available for recovery.
network:
  priority:
    - ethernet
    - wifi

ethernet:
  type: DM9051
  clk_pin: GPIO7
  mosi_pin: GPIO10
  miso_pin: GPIO3
  cs_pin: GPIO9
  interrupt_pin: GPIO8
  reset_pin: GPIO6
  # Higher SPI clock speeds can cause receive errors on this board.
  clock_speed: 8MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Don't reboot if Wi-Fi is down (fail-safe: boiler should keep heating regardless).
  reboot_timeout: 0s

  # Fallback AP for local recovery.
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret wifi_ap_password

captive_portal:

api:
  encryption:
    key: !secret esphome_api_encryption_key

  # Don't reboot if HA/API is down. The optimizer watchdog is refreshed only
  # by the explicit heartbeat button, not by target writes or a generic API
  # reconnect.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret esphome_ota_password
